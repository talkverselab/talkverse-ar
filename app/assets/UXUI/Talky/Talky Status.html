<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Talky · 7단계 상태창</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: #ECECEC; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="talky-stages.jsx"></script>

<script type="text/babel">
const FW = 390, FH = 844;

const STAGES = [
  { day: 1, title: '오늘의 시작!',     subtitle: '환하게 웃는 Talky',          msg: '좋은 아침! 새로 시작해볼까요?',     msgVi: 'Chào buổi sáng!',         hue: '#A8E0BD', mood: '😊' },
  { day: 2, title: '화이팅!',         subtitle: '주먹 불끈 Talky',           msg: '이틀째! 좋은 흐름이에요',          msgVi: 'Cố lên!',                hue: '#FFD3B6', mood: '💪' },
  { day: 3, title: '굳은 결심',        subtitle: '꼭 해내자 Talky',           msg: '습관이 만들어지는 중',            msgVi: 'Quyết tâm!',              hue: '#FFE0EB', mood: '😤' },
  { day: 4, title: '음... 괜찮아요?', subtitle: '걱정스러운 Talky',          msg: '슬슬 흔들리는 거 같은데…',         msgVi: 'Lo lắng quá…',           hue: '#C7D7F0', mood: '😟' },
  { day: 5, title: '저기요',          subtitle: '꼬라보는 Talky',            msg: '눈치 못 챈 척하지 마세요',          msgVi: 'Đừng giả vờ nhé',        hue: '#E8D9F0', mood: '😒' },
  { day: 6, title: '제발…',           subtitle: '무릎 꿇고 비는 Talky',      msg: '한 번만 봐주세요. 5분이면 돼요',   msgVi: 'Xin bạn mà…',            hue: '#FFC1D8', mood: '🙏' },
  { day: 7, title: '체념',            subtitle: '쪼그려 앉은 Talky',         msg: '할거면 해라… 안 할거면 말고',       msgVi: 'Tùy bạn thôi.',           hue: '#D8E0EC', mood: '😑' },
];

function StatusCard({stage, focused = false}) {
  const s = STAGES[stage - 1];
  return (
    <div style={{
      width: '100%', height: '100%',
      background: 'var(--bg)',
      padding: '24px 20px',
      display: 'flex', flexDirection: 'column',
      fontFamily: 'Pretendard, sans-serif',
      color: 'var(--ink)',
    }}>
      {/* top bar — minimal */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
        <div style={{fontSize:11, fontWeight:800, color:'var(--ink-soft)', letterSpacing:1.5}}>
          STREAK · DAY {s.day}
        </div>
        <div style={{fontSize:11, fontWeight:700, color:'var(--ink-faint)'}}>
          {s.day}/7
        </div>
      </div>

      {/* progress dots */}
      <div style={{display:'flex', gap:6, marginTop:10}}>
        {STAGES.map((_, i) => (
          <div key={i} style={{
            flex:1, height:5, borderRadius:3,
            background: i < s.day ? s.hue : 'rgba(31,58,110,0.1)',
            boxShadow: i < s.day ? `0 0 0 1px var(--ink) inset` : 'none',
          }}/>
        ))}
      </div>

      {/* hero zone */}
      <div className="nm-card" style={{
        marginTop: 16, padding: '24px 16px 28px',
        textAlign: 'center',
        background: `radial-gradient(circle at 50% 30%, ${s.hue}66, var(--bg) 70%)`,
        borderRadius: 28,
      }}>
        <div style={{fontSize:11, fontWeight:800, color:'var(--ink-soft)', letterSpacing:1.5}}>
          DAY {s.day} · {s.mood}
        </div>
        <div style={{fontSize:24, fontWeight:900, marginTop:4, lineHeight:1.2}}>
          {s.title}
        </div>
        <div style={{fontSize:13, fontWeight:600, color:'var(--ink-soft)', marginTop:4}}>
          {s.subtitle}
        </div>

        <div style={{margin: '14px 0 8px', display:'flex', justifyContent:'center'}}>
          <TalkyStage stage={s.day} size={focused ? 240 : 200}/>
        </div>

        {/* speech bubble */}
        <div style={{
          background:'#fff', display:'inline-block',
          padding:'12px 18px', borderRadius:20, borderTopLeftRadius: 4,
          fontSize:14, fontWeight:700, lineHeight:1.4,
          boxShadow:'0 4px 0 rgba(31,58,110,0.12), 0 0 0 2px var(--ink)',
          maxWidth:'90%',
          textAlign:'left',
        }}>
          <div style={{color:'var(--ink)'}}>{s.msg}</div>
          <div style={{fontSize:12, fontWeight:600, color:'var(--ink-soft)', marginTop:2,
            fontFamily:'Be Vietnam Pro, sans-serif'}}>{s.msgVi}</div>
        </div>
      </div>

      {/* stats row */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginTop:14}}>
        <Stat label="연속" value={s.day} unit="일"/>
        <Stat label="오늘" value={Math.max(0, 8 - s.day)} unit="회"/>
        <Stat label="완료까지" value={Math.max(0, 7 - s.day)} unit="일"/>
      </div>

      {/* CTA */}
      <button style={{
        marginTop:'auto',
        marginBottom: 8,
        padding:'16px 24px',
        background: 'var(--ink)', color: 'var(--bg)',
        fontSize:16, fontWeight:900, fontFamily:'inherit',
        border:'none', borderRadius: 18,
        boxShadow:'0 4px 0 rgba(0,0,0,0.2)',
        cursor:'pointer',
      }}>
        {s.day < 7 ? '오늘의 학습 시작' : '다시 일어나기'}
      </button>
    </div>
  );
}

function Stat({label, value, unit}) {
  return (
    <div className="nm-card" style={{padding:'10px 8px', textAlign:'center'}}>
      <div style={{fontSize:10, fontWeight:800, color:'var(--ink-faint)', letterSpacing:1}}>
        {label}
      </div>
      <div style={{fontSize:20, fontWeight:900, marginTop:2}}>
        {value}<span style={{fontSize:11, fontWeight:700, color:'var(--ink-soft)', marginLeft:2}}>{unit}</span>
      </div>
    </div>
  );
}

function Phone({children, screenLabel}) {
  return (
    <div data-screen-label={screenLabel} style={{width:FW, height:FH}}>
      <IOSDevice frameColor="#fff">
        <div style={{height:'100%', width:'100%', position:'relative', background:'var(--bg)'}}>
          <IOSStatusBar dark={false} time="9:41"/>
          <div style={{position:'absolute', top:47, left:0, right:0, bottom:0, display:'flex', flexDirection:'column'}}>
            {children}
          </div>
        </div>
      </IOSDevice>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="Talky · 7단계 상태창"
      subtitle="스트릭에 따라 표정/자세/메시지가 변합니다 — 카드 클릭 → 풀스크린">
      <DCSection id="all" title="🌍 7 stages" subtitle="Day 1 → Day 7">
        {STAGES.map(s => (
          <DCArtboard key={s.day} id={`stage-${s.day}`} label={`Day ${s.day} · ${s.subtitle}`} width={FW} height={FH}>
            <Phone screenLabel={`0${s.day} ${s.title}`}>
              <StatusCard stage={s.day}/>
            </Phone>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection id="grid" title="📊 한눈에 비교" subtitle="7단계 미니 그리드">
        <DCArtboard id="grid-all" label="전체 비교" width={840} height={560}>
          <div style={{
            width:'100%', height:'100%',
            display:'grid',
            gridTemplateColumns:'repeat(4, 1fr)',
            gridTemplateRows:'repeat(2, 1fr)',
            gap:12, padding:20,
            background:'var(--bg)',
            fontFamily:'Pretendard, sans-serif',
          }}>
            {STAGES.map(s => (
              <div key={s.day} className="nm-card" style={{
                padding:12, textAlign:'center',
                background:`radial-gradient(circle at 50% 30%, ${s.hue}66, white 70%)`,
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'space-between',
              }}>
                <div style={{fontSize:10, fontWeight:800, color:'var(--ink-soft)', letterSpacing:1}}>DAY {s.day}</div>
                <TalkyStage stage={s.day} size={130}/>
                <div style={{fontSize:13, fontWeight:900, marginTop:4}}>{s.title}</div>
                <div style={{fontSize:10, fontWeight:600, color:'var(--ink-soft)'}}>{s.subtitle}</div>
              </div>
            ))}
            {/* legend cell */}
            <div style={{
              padding:14, borderRadius:18,
              background:'var(--ink)', color:'var(--bg)',
              display:'flex', flexDirection:'column', justifyContent:'center',
            }}>
              <div style={{fontSize:11, fontWeight:800, opacity:0.7, letterSpacing:1.5}}>STATUS SYSTEM</div>
              <div style={{fontSize:18, fontWeight:900, marginTop:4, lineHeight:1.3}}>Talky가 점점<br/>화나는 시스템</div>
              <div style={{fontSize:11, fontWeight:600, opacity:0.7, marginTop:8, lineHeight:1.5}}>
                매일 학습하지 않으면<br/>Talky의 표정이 변합니다
              </div>
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
