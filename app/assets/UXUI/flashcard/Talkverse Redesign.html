<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Talkverse — Pastel Neumorphism Redesign</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.7; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mascot.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-lesson.jsx"></script>
<script type="text/babel" src="screens-profile.jsx"></script>

<script type="text/babel">
const FW = 390, FH = 844;

// Wrap any screen body in iOS frame
function Phone({children, dark=false, label, screenLabel}) {
  return (
    <div data-screen-label={screenLabel}
      style={{width:FW, height:FH, position:'relative'}}>
      <IOSDevice frameColor={dark?'#1F1B2E':'#fff'}>
        <div style={{
          height:'100%', width:'100%', position:'relative',
          background:'var(--bg)', overflow:'hidden',
        }}>
          <IOSStatusBar dark={dark} time="9:41"/>
          <div style={{
            position:'absolute', top:47, left:0, right:0, bottom:0,
            display:'flex', flexDirection:'column',
          }}>
            {children}
          </div>
        </div>
      </IOSDevice>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="Talkverse · Pastel Neumorphism Redesign"
      subtitle="한국인 → 베트남어 학습 앱 전면 개정 · 5+ 화면 변형 탐색">

      {/* === HOME === */}
      <DCSection id="home" title="🏠 홈 / 러닝맵"
        subtitle="매일 첫 화면. Day별 진행, 다음 학습 진입점.">
        <DCArtboard id="home-a" label="A · 클래식 winding path" width={FW} height={FH}>
          <Phone screenLabel="01 Home A - Winding path"><HomeA/></Phone>
        </DCArtboard>
        <DCArtboard id="home-b" label="B · 히어로 + 주간 스트립" width={FW} height={FH}>
          <Phone screenLabel="02 Home B - Hero card"><HomeB/></Phone>
        </DCArtboard>
        <DCArtboard id="home-c" label="C · 지구 마을 메타포" width={FW} height={FH}>
          <Phone screenLabel="03 Home C - Globe"><HomeC/></Phone>
        </DCArtboard>
        <DCArtboard id="home-d" label="D · 타임라인" width={FW} height={FH}>
          <Phone screenLabel="04 Home D - Timeline"><HomeD/></Phone>
        </DCArtboard>
        <DCArtboard id="home-e" label="E · 헥스 마을 (실험)" width={FW} height={FH}>
          <Phone screenLabel="05 Home E - Hex village"><HomeE/></Phone>
        </DCArtboard>
      </DCSection>

      {/* === LESSON === */}
      <DCSection id="lesson" title="📘 레슨 / 학습 화면"
        subtitle="듣기·말하기·문장 만들기·짝맞추기·회화 등 다양한 문제 타입">
        <DCArtboard id="les-a" label="A · 듣고 뜻 고르기" width={FW} height={FH}>
          <Phone screenLabel="06 Lesson A - Listen pick"><LessonA/></Phone>
        </DCArtboard>
        <DCArtboard id="les-b" label="B · 단어로 문장 만들기" width={FW} height={FH}>
          <Phone screenLabel="07 Lesson B - Word bank"><LessonB/></Phone>
        </DCArtboard>
        <DCArtboard id="les-c" label="C · 따라 말하기 (마이크)" width={FW} height={FH}>
          <Phone screenLabel="08 Lesson C - Speak"><LessonC/></Phone>
        </DCArtboard>
        <DCArtboard id="les-d" label="D · 짝맞추기" width={FW} height={FH}>
          <Phone screenLabel="09 Lesson D - Match"><LessonD/></Phone>
        </DCArtboard>
        <DCArtboard id="les-e" label="E · 시네마틱 회화" width={FW} height={FH}>
          <Phone screenLabel="10 Lesson E - Dialogue"><LessonE/></Phone>
        </DCArtboard>
      </DCSection>

      {/* === PROFILE === */}
      <DCSection id="profile" title="👤 프로필 / 통계"
        subtitle="진행 통계, 업적, 설정">
        <DCArtboard id="prof-a" label="A · 통계 우선" width={FW} height={FH}>
          <Phone screenLabel="11 Profile A - Stats"><ProfileA/></Phone>
        </DCArtboard>
        <DCArtboard id="prof-b" label="B · 마스코트 쇼케이스" width={FW} height={FH}>
          <Phone screenLabel="12 Profile B - Showcase"><ProfileB/></Phone>
        </DCArtboard>
      </DCSection>

      {/* === ONBOARDING === */}
      <DCSection id="onboarding" title="✨ 온보딩"
        subtitle="첫 실행 흐름 — 환영, 언어 선택, 일일 목표">
        <DCArtboard id="ob-a" label="① 환영 (Talky 등장)" width={FW} height={FH}>
          <Phone screenLabel="13 Onboarding 1 - Welcome"><OnboardingA/></Phone>
        </DCArtboard>
        <DCArtboard id="ob-b" label="② 언어 선택" width={FW} height={FH}>
          <Phone screenLabel="14 Onboarding 2 - Language"><OnboardingB/></Phone>
        </DCArtboard>
        <DCArtboard id="ob-c" label="③ 일일 목표" width={FW} height={FH}>
          <Phone screenLabel="15 Onboarding 3 - Goal"><OnboardingC/></Phone>
        </DCArtboard>
      </DCSection>

      {/* === DESIGN SYSTEM === */}
      <DCSection id="ds" title="🎨 디자인 시스템 참조"
        subtitle="컬러 팔레트, 마스코트 표정, 컴포넌트">
        <DCArtboard id="ds-palette" label="컬러 + 컴포넌트" width={FW} height={FH}>
          <DesignSystemSheet/>
        </DCArtboard>
        <DCArtboard id="ds-mascot" label="Talky — 표정 5종" width={FW} height={FH}>
          <MascotSheet/>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

function DesignSystemSheet() {
  const palettes = [
    {name:'Sage (Primary)', shades:['sage-50','sage-100','sage-200','sage-300','sage-400','sage-500']},
    {name:'Peach (Action)', shades:['peach-100','peach-200','peach-300','peach-400','peach-600']},
    {name:'Lavender (Accent)', shades:['lav-100','lav-200','lav-300','lav-500']},
    {name:'Sun (XP/Streak)', shades:['sun-100','sun-200','sun-300','sun-500']},
    {name:'Coral (Heart)', shades:['coral-200','coral-300','coral-500']},
  ];
  return (
    <div style={{height:'100%', overflow:'auto', padding:24, background:'var(--bg)'}} className="scroll-hidden">
      <div style={{fontSize:11, fontWeight:800, color:'var(--peach-600)', letterSpacing:1.5}}>DESIGN SYSTEM</div>
      <div style={{fontSize:22, fontWeight:900, marginTop:4}}>Pastel Neumorphism</div>
      <div style={{fontSize:12, fontWeight:600, color:'var(--ink-soft)', marginTop:6}}>
        따뜻한 크림 베이스 · 세이지 그린 주조 · 깊은 양각/음각 그림자
      </div>

      <div style={{marginTop:20, fontSize:11, fontWeight:800, color:'var(--ink-faint)', letterSpacing:1}}>COLORS</div>
      <div style={{display:'flex', flexDirection:'column', gap:14, marginTop:10}}>
        {palettes.map(p=>(
          <div key={p.name}>
            <div style={{fontSize:11, fontWeight:700, color:'var(--ink-soft)', marginBottom:6}}>{p.name}</div>
            <div style={{display:'flex', gap:6}}>
              {p.shades.map(s=>(
                <div key={s} style={{flex:1, aspectRatio:'1', borderRadius:10,
                  background:`var(--${s})`, boxShadow:'inset 0 -2px 0 rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.3)'}}/>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div style={{marginTop:24, fontSize:11, fontWeight:800, color:'var(--ink-faint)', letterSpacing:1}}>BUTTONS</div>
      <div style={{display:'flex', gap:8, marginTop:10, flexWrap:'wrap'}}>
        <button className="btn-pop btn-sage" style={{padding:'10px 16px', fontSize:13}}>계속</button>
        <button className="btn-pop btn-peach" style={{padding:'10px 16px', fontSize:13}}>시작하기</button>
        <button className="btn-pop btn-lav" style={{padding:'10px 16px', fontSize:13}}>힌트</button>
        <button className="btn-pop btn-sun" style={{padding:'10px 16px', fontSize:13}}>보상받기</button>
        <button className="btn-pop btn-coral" style={{padding:'10px 16px', fontSize:13}}>건너뛰기</button>
      </div>

      <div style={{marginTop:24, fontSize:11, fontWeight:800, color:'var(--ink-faint)', letterSpacing:1}}>SHADOWS</div>
      <div style={{display:'flex', gap:10, marginTop:10}}>
        <div style={{flex:1, padding:14, borderRadius:14, background:'var(--bg)', boxShadow:'var(--nm-out)', textAlign:'center', fontSize:10, fontWeight:700, color:'var(--ink-soft)'}}>Outset</div>
        <div style={{flex:1, padding:14, borderRadius:14, background:'var(--bg)', boxShadow:'var(--nm-in)', textAlign:'center', fontSize:10, fontWeight:700, color:'var(--ink-soft)'}}>Inset</div>
      </div>
    </div>
  );
}

function MascotSheet() {
  const moods = ['happy','wave','cheer','think','sleep'];
  const labels = {happy:'기본 (해피)', wave:'인사 (웨이브)', cheer:'환호 (응원)', think:'생각 중', sleep:'잠'};
  return (
    <div style={{height:'100%', overflow:'auto', padding:24, background:'var(--bg)'}} className="scroll-hidden">
      <div style={{fontSize:11, fontWeight:800, color:'var(--sage-500)', letterSpacing:1.5}}>MASCOT</div>
      <div style={{fontSize:22, fontWeight:900, marginTop:4}}>Talky · 지구 친구</div>
      <div style={{fontSize:12, fontWeight:600, color:'var(--ink-soft)', marginTop:6, lineHeight:1.5}}>
        지구 모양 + 작은 손발. 다국어를 탐험하는 동반자.
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginTop:20}}>
        {moods.map(m=>(
          <div key={m} className="nm-card" style={{padding:14, textAlign:'center'}}>
            <TalkyMascot size={100} mood={m}/>
            <div style={{fontSize:11, fontWeight:800, color:'var(--ink-soft)', marginTop:6}}>{labels[m]}</div>
          </div>
        ))}
        <div className="nm-card" style={{padding:14, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center'}}>
          <div style={{fontSize:11, fontWeight:700, color:'var(--ink-faint)', textAlign:'center', lineHeight:1.5}}>
            5 표정<br/>· 앞으로 추가 가능<br/>· 핵심: 따뜻함 · 호기심
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
