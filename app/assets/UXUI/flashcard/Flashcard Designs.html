<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Talkverse · Flashcards</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: #ECECEC; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tone-curve.jsx"></script>
<script type="text/babel" src="flashcard-variants.jsx"></script>

<script type="text/babel">
const FW = 390, FH = 844;
const INK = '#1F3A6E';

// ── Phone shell with session chrome ────────
function SessionPhone({variant, children, screenLabel, progress = 38, accuracy = 84, count = '4 / 12'}) {
  return (
    <div data-screen-label={screenLabel} style={{width:FW, height:FH}}>
      <IOSDevice frameColor="#fff">
        <div style={{height:'100%', width:'100%', position:'relative', background:'var(--bg)'}}>
          <IOSStatusBar dark={false} time="9:41"/>
          <div style={{position:'absolute', top:47, left:0, right:0, bottom:0, display:'flex', flexDirection:'column'}}>
            <SessionHeader progress={progress} accuracy={accuracy} count={count}/>
            <div style={{flex:1, position:'relative', padding:'12px 28px 0', display:'flex', alignItems:'center', justifyContent:'center'}}>
              {children}
            </div>
            <SessionFooter/>
          </div>
        </div>
      </IOSDevice>
    </div>
  );
}

function SessionHeader({progress, accuracy, count}) {
  return (
    <div style={{padding:'12px 20px 8px'}}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10}}>
        <div style={{
          width:32, height:32, borderRadius:10,
          background:'#fff', display:'grid', placeItems:'center',
          boxShadow:'0 1px 0 rgba(255,255,255,1) inset, 0 4px 10px rgba(31,58,110,0.08)',
          fontSize:16, color:INK, fontWeight:900,
        }}>×</div>
        <div style={{fontSize:11, fontWeight:800, color:INK, opacity:0.6, letterSpacing:1.5}}>
          {count}
        </div>
        <div style={{
          padding:'5px 10px', borderRadius:999,
          background:'#fff', boxShadow:'0 1px 0 rgba(255,255,255,1) inset, 0 4px 10px rgba(31,58,110,0.08)',
          fontSize:11, fontWeight:900, color:INK,
          display:'flex', gap:6, alignItems:'center',
        }}>
          <div style={{width:6,height:6,borderRadius:'50%',background:'#7FCBA4'}}/>
          {accuracy}%
        </div>
      </div>
      {/* progress bar */}
      <div style={{
        height:6, borderRadius:999, background:'rgba(31,58,110,0.08)',
        boxShadow:'inset 0 1px 2px rgba(31,58,110,0.1)',
        overflow:'hidden',
      }}>
        <div style={{
          width:`${progress}%`, height:'100%',
          background:'linear-gradient(90deg, #7FCBA4, #A8E0BD)',
          borderRadius:999,
          boxShadow:'0 0 8px rgba(127,203,164,0.4)',
        }}/>
      </div>
    </div>
  );
}

function SessionFooter() {
  return (
    <div style={{
      padding:'14px 20px 22px',
      display:'flex', gap:12,
    }}>
      <button style={{
        flex:1, padding:'14px',
        background:'#fff', color:INK,
        fontSize:14, fontWeight:800, fontFamily:'inherit',
        border:'none', borderRadius:18,
        boxShadow:'0 1px 0 rgba(255,255,255,1) inset, 0 4px 0 rgba(31,58,110,0.08), 0 8px 20px rgba(31,58,110,0.06)',
        cursor:'pointer', letterSpacing:0.5,
      }}>← 이전</button>
      <button style={{
        flex:1, padding:'14px',
        background:'#FFE99A', color:INK,
        fontSize:14, fontWeight:900, fontFamily:'inherit',
        border:'none', borderRadius:18,
        boxShadow:'0 1px 0 rgba(255,255,255,0.6) inset, 0 4px 0 rgba(31,58,110,0.18)',
        cursor:'pointer', letterSpacing:0.3,
      }}>답 알아요</button>
      <button style={{
        flex:1, padding:'14px',
        background:INK, color:'#fff',
        fontSize:14, fontWeight:900, fontFamily:'inherit',
        border:'none', borderRadius:18,
        boxShadow:'0 4px 0 rgba(0,0,0,0.2)',
        cursor:'pointer', letterSpacing:0.5,
      }}>다음 →</button>
    </div>
  );
}

// Card stage — sized to fit polaroid nicely
function CardStage({front, back, flipped, onFlip}) {
  return (
    <div style={{width:'100%', maxWidth:300, aspectRatio:'3/4', position:'relative'}}>
      <Flippable front={front} back={back} flipped={flipped} onFlip={onFlip}/>
    </div>
  );
}

function VariantArtboard({label, V, flipped}) {
  const Front = V.Front, Back = V.Back;
  return (
    <SessionPhone screenLabel={label}>
      <CardStage front={<Front/>} back={<Back/>} flipped={flipped}/>
    </SessionPhone>
  );
}

// Tone curve legend artboard
function ToneLegend() {
  const tones = ['ngang', 'huyen', 'sac', 'hoi', 'nga', 'nang'];
  const labels = {
    ngang: ['평성', 'a (낮은 평조)'],
    huyen: ['하강', 'à (낮게 떨어짐)'],
    sac:   ['상승', 'á (높이 올라감)'],
    hoi:   ['굽이', 'ả (내렸다 올라감)'],
    nga:   ['깨짐', 'ã (끊어졌다 상승)'],
    nang:  ['하강+', 'ạ (짧게 뚝)'],
  };
  return (
    <div style={{
      width:'100%', height:'100%', padding:28,
      background:'#FBF6EE',
      fontFamily:'Pretendard, sans-serif',
      display:'flex', flexDirection:'column',
    }}>
      <div style={{fontSize:11, fontWeight:800, color:INK, opacity:0.6, letterSpacing:2}}>SYSTEM</div>
      <div style={{fontSize:24, fontWeight:900, color:INK, marginTop:4, letterSpacing:'-0.5px'}}>
        베트남어 6성조 곡선
      </div>
      <div style={{fontSize:13, fontWeight:600, color:INK, opacity:0.65, marginTop:2}}>
        성조마다 고유한 색 + 곡선 패턴으로 시각화
      </div>
      <div style={{
        flex:1, marginTop:18,
        display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:12,
      }}>
        {tones.map(t => (
          <div key={t} style={{
            background:'#fff', borderRadius:14, padding:'12px 10px',
            boxShadow:'0 1px 0 rgba(255,255,255,1) inset, 0 4px 12px rgba(31,58,110,0.08)',
            display:'flex', flexDirection:'column', alignItems:'center',
          }}>
            <ToneCurve tone={t} size={56}/>
            <div style={{fontSize:14, fontWeight:900, color:INK, marginTop:6, fontFamily:'Be Vietnam Pro, sans-serif'}}>
              {TONES[t].mark || '·'} {TONES[t].label}
            </div>
            <div style={{fontSize:10, fontWeight:700, color:INK, opacity:0.7, marginTop:2}}>
              {labels[t][0]}
            </div>
            <div style={{fontSize:9, fontWeight:600, color:INK, opacity:0.5, marginTop:2, textAlign:'center'}}>
              {labels[t][1]}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Animated demo — auto-flip every 4s
function AutoFlipDemo({V, label}) {
  const [flipped, setFlipped] = React.useState(false);
  React.useEffect(() => {
    const t = setInterval(() => setFlipped(f => !f), 4000);
    return () => clearInterval(t);
  }, []);
  return <VariantArtboard label={label} V={V} flipped={flipped}/>;
}

function App() {
  const V = window.FlashcardVariants;
  return (
    <DesignCanvas title="Talkverse · 플래시카드"
      subtitle="한국어 → 베트남어 · 폴라로이드 스타일 · 성조 곡선 · 3D 플립">

      <DCSection id="legend" title="🎼 성조 시스템">
        <DCArtboard id="tone-legend" label="6성조 곡선 그래프" width={520} height={420}>
          <ToneLegend/>
        </DCArtboard>
      </DCSection>

      <DCSection id="variants-front" title="📸 변형 4종 — 앞면 (한국어)">
        <DCArtboard id="A-front" label="A · Classic Polaroid" width={FW} height={FH}>
          <VariantArtboard label="01 A · Classic 앞" V={V.A} flipped={false}/>
        </DCArtboard>
        <DCArtboard id="B-front" label="B · Vintage Tape" width={FW} height={FH}>
          <VariantArtboard label="02 B · Vintage 앞" V={V.B} flipped={false}/>
        </DCArtboard>
        <DCArtboard id="C-front" label="C · Minimalist" width={FW} height={FH}>
          <VariantArtboard label="03 C · Minimal 앞" V={V.C} flipped={false}/>
        </DCArtboard>
        <DCArtboard id="D-front" label="D · Layered Stack" width={FW} height={FH}>
          <VariantArtboard label="04 D · Stack 앞" V={V.D} flipped={false}/>
        </DCArtboard>
      </DCSection>

      <DCSection id="variants-back" title="🔄 변형 4종 — 뒷면 (베트남어 + 성조 + 노트)">
        <DCArtboard id="A-back" label="A · Back" width={FW} height={FH}>
          <VariantArtboard label="05 A · Classic 뒤" V={V.A} flipped={true}/>
        </DCArtboard>
        <DCArtboard id="B-back" label="B · Back" width={FW} height={FH}>
          <VariantArtboard label="06 B · Vintage 뒤" V={V.B} flipped={true}/>
        </DCArtboard>
        <DCArtboard id="C-back" label="C · Back" width={FW} height={FH}>
          <VariantArtboard label="07 C · Minimal 뒤" V={V.C} flipped={true}/>
        </DCArtboard>
        <DCArtboard id="D-back" label="D · Back" width={FW} height={FH}>
          <VariantArtboard label="08 D · Stack 뒤" V={V.D} flipped={true}/>
        </DCArtboard>
      </DCSection>

      <DCSection id="live" title="🎬 라이브 데모 — 4초마다 자동 플립">
        <DCArtboard id="live-A" label="A 데모" width={FW} height={FH}>
          <AutoFlipDemo label="09 A 라이브" V={V.A}/>
        </DCArtboard>
        <DCArtboard id="live-C" label="C 데모" width={FW} height={FH}>
          <AutoFlipDemo label="10 C 라이브" V={V.C}/>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
